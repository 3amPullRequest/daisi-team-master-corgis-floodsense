bundle:
  name: daisi-team-master-corgis-floodsense
  engine: direct

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for this target
  timezone:
    default: Asia/Singapore

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-eb06e639-3fe3.cloud.databricks.com
      profile: flood_dev
    variables:
      catalog: flood_dev

  prod:
    mode: production
    workspace:
      host: https://dbc-eb06e639-3fe3.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: flood_prod
    presets:
      trigger_pause_status: PAUSED   # delete this line once ingestion is real