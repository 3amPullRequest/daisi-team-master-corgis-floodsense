bundle:
  name: daisi-team-master-corgis-floodsense
  engine: direct

include:
  - resources/*.yml

sync:
  include:
    - src/app/frontend/dist/**   # the built web app, which .gitignore keeps out of git

variables:
  catalog:
    description: Unity Catalog catalog for this target
  timezone:
    default: Asia/Singapore
  secret_scope:
    description: Secret scope holding the data.gov.sg API key (secret key `datagovsg-api-key`)
    default: floodsense
  app_name:
    description: The app's name, unique per workspace and not prefixed in dev mode; set your own when sharing one (BUNDLE_VAR_app_name, or .databricks/bundle/dev/variable-overrides.json)
    default: floodsense-${bundle.target}
  warehouse_id:
    description: SQL warehouse the app queries
    lookup:
      warehouse: Serverless Starter Warehouse
  parser_alert_to:
    description: Comma-separated addresses emailed when a new PUB Telegram post matches no pattern (sent by SMTP as the account in the secret scope's parser-alert-smtp-user / parser-alert-smtp-password)
    default: stkinzheng@gmail.com,frostlynx6@gmail.com,eugenehengruizhe@gmail.com,stevenharrington803@gmail.com
  warning_channel:
    description: Public Telegram channel flood-live posts warnings to, as the bot whose token is the secret scope's telegram-bot-token (an administrator of the channel)
    default: "@daisi_floodsense"
  warning_bot:
    description: That bot's username, without the @, which the app links to for warnings wherever you are (t.me/<bot>?start=follow)
    default: daisi_floodsense_bot
  follow_telegram:
    description: Whether flood-live reads the bot's private messages and follows people's Telegram locations (ml/follow.py). Telegram hands each message to whichever deployment reads it first, so set "true" in one deployment of the bot only (BUNDLE_VAR_follow_telegram, or .databricks/bundle/dev/variable-overrides.json)
    default: "false"
  live_schedule:
    description: Quartz cron for flood-live; every 5 min (use 0/15 outside demo windows to save Free Edition quota)
    default: "0 0/5 * * * ?"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-eb06e639-3fe3.cloud.databricks.com
      profile: flood_dev
    variables:
      catalog: flood_dev

  prod:
    mode: production
    workspace:
      host: https://dbc-eb06e639-3fe3.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: flood_prod
    presets:
      trigger_pause_status: PAUSED   # delete this line once ingestion is real