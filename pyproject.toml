[project]
name = "daisi-team-master-corgis-floodsense"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "3amPullRequest", email = "stkinzheng@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "databricks>=0.2",
    "pyspark>=4.2.0",
]

[project.scripts]
daisi-team-master-corgis-floodsense = "daisi_team_master_corgis_floodsense:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest", "ruff"]
lint = [
    "pyproject-doctor>=0.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff.lint.per-file-ignores]
# pipeline files use the `spark` object Databricks injects at runtime
"src/pipeline/**" = ["F821"]
