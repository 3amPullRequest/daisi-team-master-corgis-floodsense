[project]
name = "daisi-team-master-corgis-floodsense"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "3amPullRequest", email = "stkinzheng@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "databricks-sdk>=0.151.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyspark>=4.2.0",
    "requests>=2.34.2",
]

[project.scripts]
daisi-team-master-corgis-floodsense = "daisi_team_master_corgis_floodsense:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest", "ruff"]
lint = [
    "pyproject-doctor>=0.5.0",
]

[tool.pytest.ini_options]
# src/pipeline is the SDP root_path, so pipeline code imports `utilities.*` the same way on Databricks
pythonpath = ["src", "src/pipeline"]

[tool.ruff]
# ingestion scripts also run on Databricks serverless (environment 2 = Python 3.11)
target-version = "py311"

[tool.pyright]
# Databricks puts the pipeline root (src/pipeline) on sys.path; mirror that for the editor
extraPaths = ["src", "src/pipeline"]

[tool.ruff.lint.per-file-ignores]
# pipeline files use the `spark` object Databricks injects at runtime
"src/pipeline/**" = ["F821"]
