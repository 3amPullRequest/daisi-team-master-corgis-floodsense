# Trains the FloodSense models and the rainfall rule on gold, logs them to MLflow and registers the best in Unity
# Catalog (src/daisi_team_master_corgis_floodsense/ml/train.py). Manual: it refreshes gold first, then trains.
#   databricks bundle run train -t dev -p flood_dev
#   databricks bundle run train -t dev -p flood_dev --params score_test=true   # the single look at the test split
#   databricks bundle run train -t dev -p flood_dev --params compare_without=antecedent,tide   # what each group adds
#   databricks bundle run train -t dev -p flood_dev --params promote=false   # @challenger only, for flood-verify
#   a sweep, logged and compared in sweep.json, registering nothing (one --params per key, as values hold commas; a
#   value with "=" in it, as model options have, needs the whole key=value in double quotes, or the CLI splits it):
#   databricks bundle run train -t dev -p flood_dev --params '"models=gated,ordinal:alert=gated:flood=logistic"' \
#     --params register=false --params compare_without=
resources:
  jobs:
    train:
      name: flood-train
      max_concurrent_runs: 1
      timeout_seconds: 7200
      parameters:
        - name: models
          default: "gated"   # the models to fit, family[:option]... (train.py); the out-of-fold scoreboard picks one
        - name: flood_weight
          default: "1"   # what a row a flash flood followed weighs in training where a model's spec doesn't say
        - name: flood_value
          default: "10"   # what a flood flagged before PUB counts in ranking the fits and choosing the Medium cut-off
        - name: override
          default: "true"   # try the rainfall rule as each fit's safety override (kept if it flags more)
        - name: register
          default: "true"   # "false" logs the chosen model without registering it
        - name: promote
          default: "true"   # "false" registers it as @challenger only; flood-verify then checks it and promotes it
        - name: score_test
          default: "false"
        - name: compare_without
          default: "tide"   # feature groups (contract.FEATURE_GROUPS) to refit the model without and compare; "" for none
      tasks:
        - task_key: refresh_gold
          pipeline_task:
            pipeline_id: ${resources.pipelines.gold_pipeline.id}
        - task_key: train
          depends_on:
            - task_key: refresh_gold
          environment_key: ml
          spark_python_task:
            python_file: ../src/ml/train.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --gold-schema
              - ${resources.schemas.gold.name}
              - --silver-schema
              - ${resources.schemas.silver.name}
              - --ml-schema
              - ${resources.schemas.ml.name}
              - --experiment
              - ${resources.experiments.training.name}
              - --model
              - ${resources.registered_models.floodsense.name}
              - --models
              - "{{job.parameters.models}}"
              - --flood-weight
              - "{{job.parameters.flood_weight}}"
              - --flood-value
              - "{{job.parameters.flood_value}}"
              - --override
              - "{{job.parameters.override}}"
              - --register
              - "{{job.parameters.register}}"
              - --promote
              - "{{job.parameters.promote}}"
              - --score-test
              - "{{job.parameters.score_test}}"
              - --compare-without
              - "{{job.parameters.compare_without}}"
      environments:
        - environment_key: ml
          spec:
            environment_version: "6"   # Python 3.12, pandas 2.3, scikit-learn 1.7, mlflow-skinny 3.12
            dependencies:
              - lightgbm==4.7.0
