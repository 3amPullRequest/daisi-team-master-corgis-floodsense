# Is FloodSense live? Every hour, fail (and email the deployer) when the newest tick, core-source fetch, rain reading or
# prediction is stale (freshness.py). It catches what flood-live can't report itself: a paused schedule, a spent Free
# Edition quota, a hung run, or NEA's feed stalling behind HTTP 200s. Paused by dev deploys like the other schedules.
resources:
  jobs:
    watchdog:
      name: flood-watchdog
      max_concurrent_runs: 1
      timeout_seconds: 600
      schedule:
        quartz_cron_expression: "0 7 * * * ?"   # hourly, at :07
        timezone_id: ${var.timezone}
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
        no_alert_for_skipped_runs: true
      tasks:
        - task_key: check
          environment_key: default
          spark_python_task:
            python_file: ../src/ingestion/check_live.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --bronze-schema
              - ${resources.schemas.bronze.name}
              - --silver-schema
              - ${resources.schemas.silver.name}
              - --ml-schema
              - ${resources.schemas.ml.name}
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - requests   # freshness.py imports ingest.sources, which imports the HTTP client
