# Re-pulls the last two complete days from the v2 API, so gaps in the 5-minute live feed get filled, then refreshes
# gold (flood-gold) from silver.
resources:
  jobs:
    daily:
      name: flood-daily
      max_concurrent_runs: 1
      timeout_seconds: 3600
      schedule:
        quartz_cron_expression: "0 30 0 * * ?"   # 00:30 SGT, once yesterday's readings have settled
        timezone_id: ${var.timezone}
      email_notifications:   # the nightly repair and gold refresh keep the live tables whole
        on_failure:
          - ${workspace.current_user.userName}
        no_alert_for_skipped_runs: true
      tasks:
        - task_key: repair
          environment_key: default
          spark_python_task:
            python_file: ../src/ingestion/backfill.py
            # re-pull the last two complete days in full; flood-live's next refresh streams them into bronze
            parameters: [api-days, --last-days, "2", --landing, "/Volumes/${var.catalog}/${resources.schemas.bronze.name}/${resources.volumes.landing.name}", --secret-scope, "${var.secret_scope}", --runner, databricks-job]
        - task_key: refresh_gold
          depends_on:
            - task_key: repair
          run_if: ALL_DONE   # gold reads silver as flood-live last refreshed it
          pipeline_task:
            pipeline_id: ${resources.pipelines.gold_pipeline.id}
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - requests
